# Claude Code integration for tmux. Sourced from ~/.tmux.conf.local (install.sh adds the line).
# Window list (Ctrl-a " and Ctrl-a w) shows each window's @session_summary
# (set by Claude's /my-session start) next to its name.
bind '"' choose-tree -w -F '#{?pane_format,#{pane_current_command}#{?pane_active,*,} "#{pane_title}",#{?window_format,#{window_name}#{window_flags}#{?#{@session_summary},  — #{@session_summary},},#{session_windows} windows#{?session_attached, (attached),}}}'
bind w choose-tree -w -F '#{?pane_format,#{pane_current_command}#{?pane_active,*,} "#{pane_title}",#{?window_format,#{window_name}#{window_flags}#{?#{@session_summary},  — #{@session_summary},},#{session_windows} windows#{?session_attached, (attached),}}}'

# "Needs an answer" marker: Claude Code hooks set @needs_answer=1 on a window
# when a session is waiting on you (Stop/Notification) and clear it when you
# reply (UserPromptSubmit). Show a red !!! on any such non-active window.
# (Only window-status-format is touched, so the marker never shows on the
# window you're currently on.)
setw -g window-status-format '#I:#W#F#{?#{==:#{@needs_answer},1},#[fg=red#,bold] !!!#[default],}'
